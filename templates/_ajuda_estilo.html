{# Estilo dos paineis de ajuda ("?"). Incluir UMA VEZ por pagina, antes
   dos paineis. Ver [_ajuda_mov_fixo.html] e afins.
   As var() tem valor de reserva: nem toda tela define a paleta em :root
   (a de Verbas, por exemplo, nao define), e sem isso o painel saia sem
   borda e sem cor. #}
<style>
/* ── PAINEL DE AJUDA ("?" flutuante) ──────────────────────────────
   O texto e longo demais para um balao de foco ou um f10Alert: tem
   secoes e uma tabela. Por isso um painel proprio, rolavel. */
.ajuda-fundo {
    display: none; position: fixed; inset: 0; z-index: 10000;
    background: rgba(15, 23, 42, 0.55); padding: 24px;
    align-items: center; justify-content: center;
}
.ajuda-fundo.aberto { display: flex; }
.ajuda-caixa {
    background: #fff; border-radius: 16px; width: min(760px, 100%);
    max-height: 88vh; display: flex; flex-direction: column;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3); overflow: hidden;
}
.ajuda-topo {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 22px; background: #f8fafc; border-bottom: 1px solid var(--border, #dde3ec);
}
.ajuda-topo h2 { font-size: 15px; font-weight: 600; color: var(--text-head, #1e293b); margin: 0; }
.ajuda-fechar {
    background: none; border: none; font-size: 22px; line-height: 1; cursor: pointer;
    color: #94a3b8; padding: 2px 8px; border-radius: 6px;
}
.ajuda-fechar:hover { background: #fee2e2; color: #dc2626; }
.ajuda-corpo { padding: 20px 22px; overflow-y: auto; font-size: 13px; line-height: 1.6; color: #374151; }
.ajuda-corpo h3 {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em;
    color: #1e3d5c; margin: 20px 0 6px;
}
.ajuda-corpo h3:first-child { margin-top: 0; }
.ajuda-corpo p  { margin: 0 0 10px; }
.ajuda-corpo ul { margin: 0 0 10px 18px; }
.ajuda-corpo li { margin-bottom: 4px; }
.ajuda-corpo b  { color: #111827; }
.ajuda-corpo table { width: 100%; border-collapse: collapse; margin: 4px 0 12px; }
.ajuda-corpo th, .ajuda-corpo td {
    border: 1px solid var(--border, #dde3ec); padding: 5px 9px; font-size: 12px; text-align: left;
}
.ajuda-corpo th { background: #f1f5f9; font-weight: 600; color: #475569; }
.ajuda-corpo td:first-child { width: 42px; text-align: center; font-weight: 700; color: #1d4ed8; }
/* Primeira coluna com rotulo em vez de numero: alinha a esquerda, larga o
   quanto precisar e NAO quebra ("1000 a 9899" saia em duas linhas). */
.ajuda-corpo td.rot { width: auto; text-align: left; white-space: nowrap;
    color: inherit; font-weight: inherit; }
.ajuda-nota {
    background: #fffbeb; border: 1px solid #fcd34d; border-radius: 8px;
    padding: 10px 12px; margin: 10px 0; font-size: 12.5px; color: #78350f;
}
.ajuda-rodape {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 22px; background: #f8fafc; border-top: 1px solid var(--border, #dde3ec);
}
.ajuda-btn-tour {
    background: var(--accent, #2a7de1); color: #fff; border: none; border-radius: 8px;
    padding: 8px 16px; font-family: var(--sans, 'IBM Plex Sans', sans-serif); font-size: 12.5px; font-weight: 600;
    cursor: pointer;
}
.ajuda-btn-tour:hover { background: #1a5fb8; }
.ajuda-btn-ok {
    background: #fff; color: #475569; border: 1px solid var(--border, #dde3ec); border-radius: 8px;
    padding: 8px 16px; font-family: var(--sans, 'IBM Plex Sans', sans-serif); font-size: 12.5px; cursor: pointer;
}
.ajuda-btn-ok:hover { background: #f1f5f9; }
</style>
