<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folha10 Simples</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.card {
    width: 420px;
    background: white;
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.25);
}

.logo {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    color: #1e3a8a;
    margin-bottom: 10px;
}

h1 {
    text-align: center;
    color: #1e3a8a;
    margin: 0;
}

.sub {
    text-align: center;
    font-size: 13px;
    margin-bottom: 20px;
}

.opcao-envio {
    background: #f1f5ff;
    border: 1px solid #dbeafe;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 10px;
}

.opcao-envio label {
    font-size: 13px;
    color: #1e3a8a;
    font-weight: bold;
    display: block;
    margin-bottom: 5px;
}

.opcoes {
    display: flex;
    gap: 20px;
}

.opcoes label {
    font-size: 14px;
    color: #333;
}

.form {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

input {
    height: 42px;
    border-radius: 8px;
    border: 1px solid #ccc;
    padding: 10px;
}

input:focus {
    border-color: #2563eb;
    outline: none;
}

.input-erro {
    border-color: red !important;
}

.btn {
    height: 44px;
    border-radius: 10px;
    border: none;
    font-weight: bold;
    cursor: pointer;
}

.btn1 {
    background: #2563eb;
    color: white;
}

.btn2 {
    background: #e5e7eb;
}

.btn3 {
    background: #dbeafe;
    color: #1e3a8a;
}

.msg {
    text-align: center;
    margin-bottom: 10px;
    font-weight: bold;
    min-height: 22px;
    line-height: 1.4;
}

.msg-erro { color: red; }
.msg-ok { color: green; }

.area-codigo {
    margin-top: 20px;
    display: none;
}

.timer-box {
    margin-top: 8px;
    margin-bottom: 10px;
    text-align: center;
    font-size: 12px;
    color: #555;
}

.timer-box strong {
    color: #1e3a8a;
}

.rodape {
    font-size: 11px;
    text-align: center;
    margin-top: 15px;
    color: #555;
}

.versao {
    font-size: 10px;
    text-align: right;
    margin-top: 10px;
}

/* MODAL */
.modal-fundo {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 999;
    justify-content: center;
    align-items: center;
}

.modal-caixa {
    width: 360px;
    max-width: 92%;
    background: white;
    border-radius: 16px;
    padding: 22px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.25);
    text-align: center;
}

.modal-titulo {
    font-size: 18px;
    font-weight: bold;
    color: #1e3a8a;
    margin-bottom: 10px;
}

.modal-texto {
    font-size: 14px;
    color: #333;
    line-height: 1.5;
    margin-bottom: 18px;
}

@media (max-width: 480px) {
    .card {
        width: 95%;
        padding: 22px;
    }
}
</style>
</head>

<body>

<div class="card">

<div class="logo">Folha10 Simples</div>

<h1>Criar acesso</h1>

<div class="sub">
Informe seus dados para receber o código
</div>

<div id="msg" class="msg"></div>

<div class="form">

<input type="text" id="cpf" placeholder="CPF ou CNPJ">
<input type="text" id="nome" placeholder="Nome completo">
<input type="text" id="celular" placeholder="Celular">
<input type="text" id="email" placeholder="E-mail">

<div class="opcao-envio">
    <label>Receber código por:</label>

    <div class="opcoes">
        <label>
            <input type="radio" name="canal" value="email" checked>
            E-mail
        </label>

        <label>
            <input type="radio" name="canal" value="whatsapp">
            WhatsApp
        </label>
    </div>
</div>

<button class="btn btn1" onclick="enviarCodigo()">Enviar Código</button>
<button class="btn btn2" onclick="limpar()">Limpar</button>

</div>

<div id="codigoArea" class="area-codigo">

<input type="text" id="codigo" placeholder="Digite o código recebido" maxlength="6">

<div id="timerBox" class="timer-box" style="display:none;">
    Código expira em <strong id="contador">05:00</strong>
</div>

<button class="btn btn1" onclick="confirmar()">Confirmar</button>
<button class="btn btn3" onclick="reenviarCodigo()">Reenviar código</button>

</div>

<div class="rodape">
Seus dados estão protegidos. Não compartilhamos suas informações.
</div>

<div class="versao">
Versão 260323-0935
</div>

</div>

<!-- MODAL -->
<div id="modalFundo" class="modal-fundo">
    <div class="modal-caixa">
        <div class="modal-titulo" id="modalTitulo">Aviso</div>
        <div class="modal-texto" id="modalTexto">Texto</div>
        <button class="btn btn1" onclick="fecharModal()">OK</button>
    </div>
</div>

<script>
let timerInterval = null;
let segundosRestantes = 0;

function limparErros() {
    ["cpf","nome","celular","email","codigo"].forEach(id=>{
        document.getElementById(id).classList.remove("input-erro");
    });
}

function msg(texto, tipo) {
    let m = document.getElementById("msg");
    m.innerHTML = texto;
    m.className = "msg " + (tipo === "ok" ? "msg-ok" : "msg-erro");
}

function erroCampo(id) {
    document.getElementById(id).classList.add("input-erro");
}

function canalSelecionado() {
    return document.querySelector('input[name="canal"]:checked').value;
}

function mostrarModal(titulo, texto) {
    document.getElementById("modalTitulo").innerText = titulo;
    document.getElementById("modalTexto").innerText = texto;
    document.getElementById("modalFundo").style.display = "flex";
}

function fecharModal() {
    document.getElementById("modalFundo").style.display = "none";
}

function formatarTempo(segundos) {
    const min = String(Math.floor(segundos / 60)).padStart(2, "0");
    const seg = String(segundos % 60).padStart(2, "0");
    return min + ":" + seg;
}

function iniciarContador() {
    pararContador();
    segundosRestantes = 300;
    document.getElementById("timerBox").style.display = "block";
    document.getElementById("contador").innerText = formatarTempo(segundosRestantes);

    timerInterval = setInterval(() => {
        segundosRestantes--;
        document.getElementById("contador").innerText = formatarTempo(segundosRestantes);

        if (segundosRestantes <= 0) {
            pararContador();
            document.getElementById("codigoArea").style.display = "none";
            document.getElementById("codigo").value = "";
            msg("Código expirado. Solicite um novo código.", "erro");
            mostrarModal("Código expirado", "O código expirou após 5 minutos. Solicite um novo código.");
        }
    }, 1000);
}

function pararContador() {
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }
}

async function enviarCodigo() {
    limparErros();
    msg("", "erro");

    let cpf = document.getElementById("cpf").value;
    let nome = document.getElementById("nome").value.toLowerCase();
    let celular = document.getElementById("celular").value;
    let email = document.getElementById("email").value;
    let canal = canalSelecionado();

    document.getElementById("nome").value = nome;

    let resp = await fetch("/validar", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
            cpf: cpf,
            nome: nome,
            celular: celular,
            email: email,
            canal: canal
        })
    });

    let data = await resp.json();

    if (!data.ok) {
        if (data.campo) erroCampo(data.campo);
        msg(data.msg, "erro");
        return;
    }

    document.getElementById("codigoArea").style.display = "block";
    iniciarContador();

    if (canal === "email") {
        msg(
            data.msg + "<br><span style='font-size:11px;color:#555;'>Caso não receba, verifique a caixa de spam.</span>",
            "ok"
        );
    } else {
        msg(
            data.msg + "<br><span style='font-size:11px;color:#555;'>Confira se o WhatsApp está ativo.</span>",
            "ok"
        );
    }
}

async function reenviarCodigo() {
    document.getElementById("codigo").value = "";
    await enviarCodigo();
}

async function confirmar() {
    document.getElementById("codigo").classList.remove("input-erro");

    let cpf = document.getElementById("cpf").value;
    let codigo = document.getElementById("codigo").value;

    let resp = await fetch("/confirmar", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
            cpf: cpf,
            codigo: codigo
        })
    });

    let data = await resp.json();

    if (!data.ok) {
        if (data.campo) erroCampo(data.campo);

        msg(data.msg, "erro");

        if (data.msg && data.msg.toLowerCase().includes("expirado")) {
            mostrarModal("Código expirado", "O código expirou após 5 minutos. Solicite um novo código.");
            document.getElementById("codigoArea").style.display = "none";
            document.getElementById("codigo").value = "";
            pararContador();
            document.getElementById("timerBox").style.display = "none";
        }

        return;
    }

    pararContador();
    document.getElementById("timerBox").style.display = "none";
    msg(data.msg, "ok");
    mostrarModal("Cadastro concluído", "Cadastro realizado com sucesso.");
}

function limpar() {
    document.getElementById("cpf").value = "";
    document.getElementById("nome").value = "";
    document.getElementById("celular").value = "";
    document.getElementById("email").value = "";
    document.getElementById("codigo").value = "";
    document.getElementById("codigoArea").style.display = "none";
    document.getElementById("timerBox").style.display = "none";
    pararContador();
    limparErros();
    msg("", "");
}
</script>

</body>
</html>
