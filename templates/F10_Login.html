<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folha10 Simples - Login</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            width: 420px;
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 18px 50px rgba(0,0,0,0.25);
        }

        .logo {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin: 0;
        }

        .sub {
            text-align: center;
            font-size: 13px;
            margin-bottom: 20px;
            color: #444;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input[type="text"],
        input[type="password"] {
            height: 42px;
            border-radius: 8px;
            border: 1px solid #ccc;
            padding: 10px;
            font-size: 14px;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #2563eb;
            outline: none;
        }

        .input-erro {
            border-color: red !important;
        }

        .linha-erro {
            min-height: 14px;
            font-size: 11px;
            color: red;
            margin-top: -6px;
            margin-bottom: 2px;
            padding-left: 2px;
        }

        .linha-check {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #333;
            margin-top: 4px;
            margin-bottom: 6px;
        }

        .linha-check input {
            width: auto;
            margin: 0;
        }

        .btn {
            height: 44px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn1 {
            background: #2563eb;
            color: white;
        }

        .btn1:hover:not(:disabled) {
            background: #1d4ed8;
        }

        .btn1:disabled {
            background: #93c5fd;
            color: #eff6ff;
            cursor: not-allowed;
        }

        .btn2 {
            background: #e5e7eb;
            color: #111827;
        }

        .msg {
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
            min-height: 22px;
            line-height: 1.4;
        }

        .msg-erro { color: red; }
        .msg-ok { color: green; }

        .links {
            text-align: center;
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .links a {
            color: #1d4ed8;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .rodape {
            font-size: 11px;
            text-align: center;
            margin-top: 15px;
            color: #555;
        }

        .versao {
            font-size: 10px;
            text-align: right;
            margin-top: 10px;
            color: #777;
        }

        @media (max-width: 480px) {
            .card {
                width: 95%;
                padding: 22px;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">Folha10 Simples</div>

    <h1>Login</h1>
    <div class="sub">Informe seu CPF e sua senha de 6 dígitos</div>

    <div id="msg" class="msg"></div>

    <div class="form">
        <input type="text" id="cpf" placeholder="CPF" autocomplete="off">
        <div id="erro_cpf" class="linha-erro"></div>

        <input type="password" id="senha" placeholder="Senha de 6 dígitos" maxlength="6" autocomplete="off">
        <div id="erro_senha" class="linha-erro"></div>

        <label class="linha-check">
            <input type="checkbox" id="manter">
            Manter conectado neste dispositivo
        </label>

        <button id="btnEntrar" class="btn btn1" onclick="fazerLogin()" disabled>Entrar</button>
        <button class="btn btn2" onclick="limpar()">Limpar</button>
    </div>

    <div class="links">
        <a href="/cadastro">Criar conta</a>
        <a href="#">Esqueci minha senha</a>
    </div>

    <div class="rodape">
        A senha inicial é o código de 6 dígitos confirmado no cadastro.
    </div>

    <div class="versao">
        Versão 260325-1505
    </div>
</div>

<script>
let loginValido = false;

function el(id) {
    return document.getElementById(id);
}

function soNumeros(valor) {
    return (valor || "").replace(/\D/g, "");
}

function msg(texto, tipo) {
    let m = el("msg");
    m.innerHTML = texto || "";

    if (tipo === "ok") {
        m.className = "msg msg-ok";
    } else if (tipo === "erro") {
        m.className = "msg msg-erro";
    } else {
        m.className = "msg";
    }
}

function limparErros() {
    ["cpf", "senha"].forEach(id => {
        el(id).classList.remove("input-erro");
    });

    el("erro_cpf").innerText = "";
    el("erro_senha").innerText = "";
}

function erroCampo(id, texto) {
    el(id).classList.add("input-erro");
    let alvo = el("erro_" + id);
    if (alvo) alvo.innerText = texto || "";
}

function limparErroCampo(id) {
    el(id).classList.remove("input-erro");
    let alvo = el("erro_" + id);
    if (alvo) alvo.innerText = "";
}

function validarCPF(cpf) {
    cpf = soNumeros(cpf);

    if (cpf.length !== 11) return false;
    if (/^(\d)\1{10}$/.test(cpf)) return false;

    let soma = 0;
    let resto = 0;

    for (let i = 0; i < 9; i++) {
        soma += parseInt(cpf.charAt(i)) * (10 - i);
    }

    resto = (soma * 10) % 11;
    if (resto === 10) resto = 0;
    if (resto !== parseInt(cpf.charAt(9))) return false;

    soma = 0;
    for (let i = 0; i < 10; i++) {
        soma += parseInt(cpf.charAt(i)) * (11 - i);
    }

    resto = (soma * 10) % 11;
    if (resto === 10) resto = 0;
    if (resto !== parseInt(cpf.charAt(10))) return false;

    return true;
}

function validarSenha(senha) {
    return /^\d{6}$/.test((senha || "").trim());
}

function formatarCPF() {
    let v = soNumeros(el("cpf").value);

    if (v.length > 11) v = v.substring(0, 11);

    v = v
        .replace(/^(\d{3})(\d)/, "$1.$2")
        .replace(/^(\d{3})\.(\d{3})(\d)/, "$1.$2.$3")
        .replace(/\.(\d{3})(\d)/, ".$1-$2");

    el("cpf").value = v;
}

function formatarSenha() {
    let v = soNumeros(el("senha").value);
    if (v.length > 6) v = v.substring(0, 6);
    el("senha").value = v;
}

function validarCampos() {
    limparErroCampo("cpf");
    limparErroCampo("senha");

    let cpf = el("cpf").value;
    let senha = el("senha").value;

    let cpfOk = validarCPF(cpf);
    let senhaOk = validarSenha(senha);

    if (cpf.length > 0 && !cpfOk) {
        erroCampo("cpf", "CPF inválido");
    }

    if (senha.length > 0 && !senhaOk) {
        erroCampo("senha", "Senha deve ter 6 dígitos");
    }

    loginValido = cpfOk && senhaOk;
    el("btnEntrar").disabled = !loginValido;
}

async function fazerLogin() {
    limparErros();
    msg("", "");

    validarCampos();

    if (!loginValido) {
        msg("Preencha corretamente CPF e senha.", "erro");
        return;
    }

    const dados = {
        cpf: el("cpf").value,
        senha: el("senha").value,
        manter: el("manter").checked
    };

    try {
        const resp = await fetch("/fazer_login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(dados)
        });

        const data = await resp.json();

        if (!data.ok) {
            msg(data.msg || "Dados inválidos", "erro");
            erroCampo("cpf", "");
            erroCampo("senha", "");
            return;
        }

        msg(data.msg || "Login realizado com sucesso", "ok");

        if (data.redirect) {
            window.location.href = data.redirect;
        }

    } catch (e) {
        msg("Erro ao processar o login.", "erro");
    }
}

function limpar() {
    el("cpf").value = "";
    el("senha").value = "";
    el("manter").checked = false;
    limparErros();
    msg("", "");
    loginValido = false;
    el("btnEntrar").disabled = true;
}

el("cpf").addEventListener("input", () => {
    formatarCPF();
    validarCampos();
});

el("senha").addEventListener("input", () => {
    formatarSenha();
    validarCampos();
});
</script>

</body>
</html>
