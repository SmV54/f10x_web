<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folha10 Simples - Login</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.card {
    width: 380px;
    background: white;
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.25);
}

.logo {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    color: #1e3a8a;
    margin-bottom: 8px;
}

h1 {
    text-align: center;
    color: #1e3a8a;
    margin: 0;
    font-size: 26px;
}

.sub {
    text-align: center;
    font-size: 13px;
    margin-top: 6px;
    margin-bottom: 18px;
    color: #444;
}

.form {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

input[type="text"],
input[type="password"] {
    height: 42px;
    border-radius: 8px;
    border: 1px solid #ccc;
    padding: 10px;
    font-size: 14px;
}

input:focus {
    border-color: #2563eb;
    outline: none;
}

.input-erro {
    border-color: red !important;
}

.linha-erro {
    min-height: 14px;
    font-size: 11px;
    color: red;
    margin-top: -6px;
    margin-bottom: 2px;
    padding-left: 2px;
}

.linha-manter {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #333;
    margin-top: 4px;
}

.btn {
    height: 44px;
    border-radius: 10px;
    border: none;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.btn1 {
    background: #2563eb;
    color: white;
}

.btn1:hover:not(:disabled) {
    background: #1d4ed8;
}

.btn1:disabled {
    background: #93c5fd;
    color: #eff6ff;
    cursor: not-allowed;
}

.btn2 {
    background: #e5e7eb;
    color: #111827;
}

.btn2:hover {
    background: #d1d5db;
}

.links {
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    font-size: 13px;
}

.links a {
    text-decoration: none;
    color: #2563eb;
}

.links a:hover {
    text-decoration: underline;
}

/* 🔥 AJUSTE AQUI */
.msg {
    text-align: center;
    margin-bottom: 10px;
    font-weight: bold;
    font-size: 12px;          /* menor */
    white-space: nowrap;      /* força 1 linha */
    overflow: hidden;
    text-overflow: ellipsis;  /* evita quebrar layout */
}

.msg-erro { color: red; }
.msg-ok { color: green; }

.versao {
    font-size: 10px;
    text-align: right;
    margin-top: 10px;
    color: #777;
}

/* MODAL */
.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 999;
    justify-content: center;
    align-items: center;
}
.modal-overlay.ativo {
    display: flex;
}
.modal-box {
    background: white;
    border-radius: 14px;
    padding: 28px 32px;
    width: 320px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    text-align: center;
}
.modal-box p {
    font-size: 15px;
    color: #1e3a8a;
    font-weight: 600;
    margin-bottom: 20px;
    line-height: 1.5;
}
.modal-box button {
    height: 40px;
    width: 100px;
    border-radius: 8px;
    border: none;
    background: #2563eb;
    color: white;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
}
.modal-box button:hover {
    background: #1d4ed8;
}
</style>
</head>

<body>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
        <p id="modalTexto"></p>
        <button onclick="modalOk()">OK</button>
    </div>
</div>

<div class="card">

    <div class="logo">Folha10 Simples</div>

    <h1>Login</h1>

    <div class="sub">Acesse sua conta</div>

    <div id="msg" class="msg"></div>

    <div class="form">

        <input type="text" id="cpf" placeholder="CPF" maxlength="14" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" value="">
        <div id="erro_cpf" class="linha-erro"></div>

        <input type="password" id="senha" placeholder="Senha (6 dígitos)" maxlength="6" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly')" value="">
        <div id="erro_senha" class="linha-erro"></div>

        <div class="linha-manter">
            <input type="checkbox" id="manter">
            <label for="manter">Manter conectado</label>
        </div>

        <button id="btnLogin" class="btn btn1" onclick="fazerLogin()">
            Entrar
        </button>

        <button class="btn btn2" onclick="limpar()">
            Limpar
        </button>

        <div class="links">
            <a href="/recuperar_senha">Esqueci minha senha</a>
            <a href="/cadastro">Criar conta</a>
        </div>

    </div>

    <div class="versao">
        Versão {{ versao }}
    </div>

</div>

<script>

function el(id){ return document.getElementById(id); }

function soNumeros(v){
    return (v || "").replace(/\D/g, "");
}

function formatarCPF(){
    let v = soNumeros(el("cpf").value).slice(0,11);

    v = v
        .replace(/^(\d{3})(\d)/, "$1.$2")
        .replace(/^(\d{3})\.(\d{3})(\d)/, "$1.$2.$3")
        .replace(/\.(\d{3})(\d)/, ".$1-$2");

    el("cpf").value = v;
}

function limparErros(){
    ["cpf","senha"].forEach(id=>{
        el(id).classList.remove("input-erro");
    });

    ["erro_cpf","erro_senha"].forEach(id=>{
        el(id).innerText = "";
    });
}

function msg(texto, tipo){
    let m = el("msg");
    m.innerText = texto || "";
    m.className = "msg";

    if(tipo === "erro") m.classList.add("msg-erro");
    if(tipo === "ok") m.classList.add("msg-ok");
}

async function fazerLogin(){

    limparErros();
    msg("Verificando...", "");

    try {
        const resp = await fetch("/fazer_login", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({
                cpf: el("cpf").value,
                senha: el("senha").value,
                manter: el("manter").checked
            })
        });

        if (!resp.ok) {
            msg("Erro no servidor (HTTP " + resp.status + ")", "erro");
            return;
        }

        const data = await resp.json();

        if(!data.ok){
            if(data.bloqueado){
                msg("Login bloqueado. Aguarde alguns minutos.", "erro");
                return;
            }
            msg(data.msg || "Erro no login", "erro");
            el("senha").classList.add("input-erro");
            return;
        }

        if (data.redirect) {
            window.location.href = data.redirect;
            return;
        }

    } catch(e) {
        msg("Erro de conexão: " + e.message, "erro");
    }
}

function limpar(){
    el("cpf").value = "";
    el("senha").value = "";
    el("manter").checked = false;
    limparErros();
    msg("", "");
}

el("cpf").addEventListener("input", formatarCPF);

let _modalRedirect = "";

function abrirModal(texto, redirect){
    _modalRedirect = redirect;
    el("modalTexto").innerText = texto;
    el("modalOverlay").classList.add("ativo");
}

function modalOk(){
    el("modalOverlay").classList.remove("ativo");
    window.location.href = _modalRedirect;
}

</script>

<script src="/static/f10_dialog.js"></script>

</body>
</html>
