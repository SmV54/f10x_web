<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folha10 Simples - Cadastro</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.card {
    width: 420px;
    background: white;
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.25);
}

.logo {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    color: #1e3a8a;
    margin-bottom: 10px;
}

h1 {
    text-align: center;
    color: #1e3a8a;
    margin: 0;
    font-size: 28px;
}

.sub {
    text-align: center;
    font-size: 11px;
    margin-top: 8px;
    margin-bottom: 20px;
    color: #444;
    line-height: 1.4;
    /* Frase tem que caber em uma linha só. Em Arial 11px ela mede ~351px; a
       área útil do card é 360px e os -6px de margem tomam emprestado um pouco
       do padding, chegando a 372px. O nowrap garante o resultado mesmo se a
       fonte cair num fallback mais largo. Aumentar o corpo da letra faz a
       frase estourar — a 12px ela já mede 384px. */
    white-space: nowrap;
    margin-left: -6px;
    margin-right: -6px;
}

.opcao-envio {
    background: #f1f5ff;
    border: 1px solid #dbeafe;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 10px;
}

.opcao-envio label {
    font-size: 13px;
    color: #1e3a8a;
    font-weight: bold;
    display: block;
    margin-bottom: 5px;
}

.opcoes {
    display: flex;
    gap: 20px;
}

.opcoes label {
    font-size: 14px;
    color: #333;
    font-weight: normal;
}

.form {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

input[type="text"],
input[type="password"] {
    height: 42px;
    border-radius: 8px;
    border: 1px solid #ccc;
    padding: 10px;
    font-size: 14px;
}

input[type="text"]:focus,
input[type="password"]:focus {
    border-color: #2563eb;
    outline: none;
}

.input-erro {
    border-color: red !important;
}

.linha-erro {
    min-height: 14px;
    font-size: 11px;
    color: red;
    margin-top: -6px;
    margin-bottom: 2px;
    padding-left: 2px;
}

.btn {
    height: 44px;
    border-radius: 10px;
    border: none;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.btn1 {
    background: #2563eb;
    color: white;
}

.btn1:hover:not(:disabled) {
    background: #1d4ed8;
}

.btn1:disabled {
    background: #93c5fd;
    color: #eff6ff;
    cursor: not-allowed;
}

.btn2 {
    background: #e5e7eb;
    color: #111827;
}

.btn2:hover {
    background: #d1d5db;
}

.btn3 {
    background: #dbeafe;
    color: #1e3a8a;
}

.msg {
    text-align: center;
    margin-bottom: 10px;
    font-weight: bold;
    min-height: 22px;
    line-height: 1.4;
}

.msg-erro { color: red; }
.msg-ok { color: green; }

.area-codigo {
    margin-top: 20px;
    display: none;
}

.timer-box {
    margin-top: 8px;
    margin-bottom: 10px;
    text-align: center;
    font-size: 12px;
    color: #555;
}

.timer-box strong {
    color: #1e3a8a;
}

.rodape {
    font-size: 11px;
    text-align: center;
    margin-top: 15px;
    color: #555;
}

.versao {
    font-size: 10px;
    text-align: right;
    margin-top: 10px;
    color: #777;
}

.modal-fundo {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 999;
    justify-content: center;
    align-items: center;
}

.modal-caixa {
    width: 360px;
    max-width: 92%;
    background: white;
    border-radius: 16px;
    padding: 22px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.25);
    text-align: center;
}

.modal-titulo {
    font-size: 18px;
    font-weight: bold;
    color: #1e3a8a;
    margin-bottom: 10px;
}

.modal-texto {
    font-size: 14px;
    color: #333;
    line-height: 1.5;
    margin-bottom: 18px;
}

@media (max-width: 480px) {
    .card {
        width: 95%;
        padding: 22px;
    }

    h1 {
        font-size: 24px;
    }

    /* No celular não cabe em uma linha — aí deixa quebrar, que é melhor do
       que a frase vazar para fora do card. */
    .sub {
        white-space: normal;
        margin-left: 0;
        margin-right: 0;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">Folha10 Simples</div>

    <h1>Cadastro</h1>

    <div class="sub">
        Crie o seu acesso — a(s) empresa(s) você cadastra no passo seguinte
    </div>

    <div id="msg" class="msg"></div>

    <div class="form">

        <!-- readonly de proposito: campo somente-leitura nao recebe autofill do
             navegador. O JS tira o readonly no primeiro clique/foco. -->
        <input type="text" id="cpf" placeholder="CPF" autocomplete="off" maxlength="14" readonly>
        <div id="erro_cpf" class="linha-erro"></div>

        <input type="text" id="nome" placeholder="Nome completo" autocomplete="off" readonly>
        <div id="erro_nome" class="linha-erro"></div>

        <input type="text" id="celular" placeholder="Celular com DDD" autocomplete="off" readonly>
        <div id="erro_celular" class="linha-erro"></div>

        <input type="text" id="email" placeholder="E-mail" autocomplete="off" readonly>
        <div id="erro_email" class="linha-erro"></div>

        <div class="opcao-envio">
            <label>Receber código por:</label>

            <div class="opcoes">
                <label>
                    <input type="radio" name="canal" value="whatsapp" checked>
                    WhatsApp
                </label>

                <label>
                    <input type="radio" name="canal" value="email">
                    E-mail
                </label>
            </div>
        </div>

        <button id="btnEnviar" class="btn btn1" onclick="enviarCodigo()" disabled>
            Cadastrar Conta
        </button>

        <button class="btn btn2" onclick="limpar()">
            Limpar
        </button>
    </div>

    <div id="codigoArea" class="area-codigo">

        <input type="text" id="codigo" placeholder="Digite o código recebido" maxlength="6" autocomplete="off">
        <div id="erro_codigo" class="linha-erro"></div>

        <div id="timerBox" class="timer-box" style="display:none;">
            Código expira em <strong id="contador">05:00</strong>
        </div>

        <button id="btnValidarCodigo" class="btn btn1" onclick="validarCodigoCadastro()">Validar código</button>
        <button class="btn btn3" onclick="reenviarCodigo()">Reenviar código</button>

        <div id="senhaArea" style="display:none; margin-top:12px;">
            <input type="password" id="senha" placeholder="Crie uma senha numérica de 6 dígitos" maxlength="6" autocomplete="off" inputmode="numeric" oninput="this.value=this.value.replace(/\D/g,'')">
            <div id="erro_senha" class="linha-erro"></div>

            <input type="password" id="senha2" placeholder="Confirme a senha" maxlength="6" autocomplete="off" inputmode="numeric" oninput="this.value=this.value.replace(/\D/g,'')">
            <div id="erro_senha2" class="linha-erro"></div>

            <button class="btn btn1" onclick="finalizarCadastro()">Concluir cadastro</button>
        </div>

    </div>

    <div class="rodape">
        Seus dados estão protegidos. Não compartilhamos suas informações.
    </div>

    <div class="versao">
        Versão {{ versao }}
    </div>

</div>

<div id="modalFundo" class="modal-fundo">
    <div class="modal-caixa">
        <div class="modal-titulo" id="modalTitulo">Aviso</div>
        <div class="modal-texto" id="modalTexto">Texto</div>
        <button class="btn btn1" onclick="fecharModal()">OK</button>
    </div>
</div>

<script>
let timerInterval = null;
let segundosRestantes = 0;
let timeoutPrevalidacao = null;
let formularioValido = false;

function el(id) {
    return document.getElementById(id);
}

function limparErros() {
    ["cpf", "nome", "celular", "email", "codigo", "senha", "senha2"].forEach(id => {
        const campo = el(id);
        if (campo) campo.classList.remove("input-erro");
    });

    ["erro_cpf", "erro_nome", "erro_celular", "erro_email", "erro_codigo", "erro_senha", "erro_senha2"].forEach(id => {
        const campo = el(id);
        if (campo) campo.innerText = "";
    });
}

function msg(texto, tipo) {
    let m = el("msg");
    m.innerHTML = texto || "";
    if (tipo === "ok") {
        m.className = "msg msg-ok";
    } else if (tipo === "erro") {
        m.className = "msg msg-erro";
    } else {
        m.className = "msg";
    }
}

function erroCampo(id, texto = "") {
    el(id).classList.add("input-erro");
    const alvo = el("erro_" + id);
    if (alvo) alvo.innerText = texto;
}

function limparErroCampo(id) {
    const campo = el(id);
    if (campo) campo.classList.remove("input-erro");
    const alvo = el("erro_" + id);
    if (alvo) alvo.innerText = "";
}

function canalSelecionado() {
    return document.querySelector('input[name="canal"]:checked').value;
}

function mostrarModal(titulo, texto) {
    el("modalTitulo").innerText = titulo;
    el("modalTexto").innerText = texto;
    el("modalFundo").style.display = "flex";
}

function fecharModal() {
    el("modalFundo").style.display = "none";
}

function formatarTempo(segundos) {
    const min = String(Math.floor(segundos / 60)).padStart(2, "0");
    const seg = String(segundos % 60).padStart(2, "0");
    return min + ":" + seg;
}

function iniciarContador() {
    pararContador();
    segundosRestantes = 300;
    el("timerBox").style.display = "block";
    el("contador").innerText = formatarTempo(segundosRestantes);

    timerInterval = setInterval(() => {
        segundosRestantes--;
        el("contador").innerText = formatarTempo(segundosRestantes);

        if (segundosRestantes <= 0) {
            pararContador();
            el("codigoArea").style.display = "none";
            el("senhaArea").style.display = "none";
            el("codigo").value = "";
            el("senha").value = "";
            el("senha2").value = "";
            el("erro_codigo").innerText = "";
            msg("Código expirado. Solicite um novo código.", "erro");
            mostrarModal("Código expirado", "O código expirou após 5 minutos. Solicite um novo código.");
        }
    }, 1000);
}

function pararContador() {
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }
}

function atualizarBotaoEnviar(habilitar) {
    formularioValido = !!habilitar;
    el("btnEnviar").disabled = !formularioValido;
}

function soNumeros(valor) {
    return (valor || "").replace(/\D/g, "");
}

function formatarDocumento() {
    let v = soNumeros(el("cpf").value);

    if (v.length > 11) v = v.substring(0, 11);

    v = v
        .replace(/^(\d{3})(\d)/, "$1.$2")
        .replace(/^(\d{3})\.(\d{3})(\d)/, "$1.$2.$3")
        .replace(/\.(\d{3})(\d)/, ".$1-$2");

    el("cpf").value = v;
}

function formatarCelular() {
    let v = soNumeros(el("celular").value);

    if (v.startsWith("55") && v.length > 11) {
        v = v.substring(2);
    }

    if (v.length > 11) v = v.substring(0, 11);

    if (v.length <= 2) {
        el("celular").value = v;
        return;
    }

    if (v.length <= 7) {
        el("celular").value = "(" + v.substring(0, 2) + ") " + v.substring(2);
        return;
    }

    el("celular").value = "(" + v.substring(0, 2) + ") " + v.substring(2, 7) + "-" + v.substring(7);
}

function normalizarNome() {
    let v = el("nome").value || "";
    v = v.replace(/\s+/g, " ");
    el("nome").value = v;
}

function dadosFormulario() {
    return {
        cpf: el("cpf").value,
        nome: (el("nome").value || "").trim(),
        celular: el("celular").value,
        email: (el("email").value || "").trim(),
        canal: canalSelecionado()
    };
}

function aplicarErrosPrevalidacao(erros) {
    limparErroCampo("cpf");
    limparErroCampo("nome");
    limparErroCampo("celular");
    limparErroCampo("email");

    if (erros.cpf) erroCampo("cpf", erros.cpf);
    if (erros.nome) erroCampo("nome", erros.nome);
    if (erros.celular) erroCampo("celular", erros.celular);
    if (erros.email) erroCampo("email", erros.email);
}

async function prevalidarSilencioso() {
    const dados = dadosFormulario();

    try {
        const resp = await fetch("/prevalidar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(dados)
        });

        const data = await resp.json();

        aplicarErrosPrevalidacao(data.erros || {});
        atualizarBotaoEnviar(!!data.habilita_enviar_codigo);

        if (!data.habilita_enviar_codigo) {
            el("codigoArea").style.display = "none";
            el("senhaArea").style.display = "none";
        }

        return data;
    } catch (e) {
        atualizarBotaoEnviar(false);
        return {
            ok: false,
            erros: {},
            habilita_enviar_codigo: false
        };
    }
}

function agendarPrevalidacao() {
    if (timeoutPrevalidacao) {
        clearTimeout(timeoutPrevalidacao);
    }

    timeoutPrevalidacao = setTimeout(() => {
        prevalidarSilencioso();
    }, 250);
}

async function enviarCodigo() {
    limparErros();
    msg("", "");

    const resultadoPre = await prevalidarSilencioso();

    if (!resultadoPre.ok) {
        msg("Preencha corretamente todos os campos antes de cadastrar a conta.", "erro");
        return;
    }

    let dados = dadosFormulario();

    let resp = await fetch("/validar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dados)
    });

    let data = await resp.json();

    if (!data.ok) {
        if (data.erros) {
            aplicarErrosPrevalidacao(data.erros);
        }

        if (data.campo) {
            erroCampo(data.campo, data.msg || "");
        }

        msg(data.msg || "Existem campos inválidos.", "erro");
        atualizarBotaoEnviar(false);
        return;
    }

    el("codigoArea").style.display = "block";
    el("senhaArea").style.display = "none";
    el("codigo").value = "";
    el("senha").value = "";
    el("senha2").value = "";
    el("erro_codigo").innerText = "";
    iniciarContador();

    if (dados.canal === "email") {
        msg(
            data.msg + "<br><span style='font-size:11px;color:#555;'>Caso não receba, verifique a caixa de spam.</span>",
            "ok"
        );
    } else {
        msg(
            data.msg + "<br><span style='font-size:11px;color:#555;'>Confira se o WhatsApp está ativo.</span>",
            "ok"
        );
    }
}

async function reenviarCodigo() {
    el("codigo").value = "";
    el("senha").value = "";
    el("senha2").value = "";
    el("senhaArea").style.display = "none";
    el("erro_codigo").innerText = "";
    el("erro_senha").innerText = "";
    el("erro_senha2").innerText = "";
    await enviarCodigo();
}

async function validarCodigoCadastro() {
    limparErroCampo("codigo");
    limparErroCampo("senha");
    limparErroCampo("senha2");

    let cpf = el("cpf").value;
    let codigo = el("codigo").value.trim();

    let resp = await fetch("/validar_codigo_cadastro", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            cpf: cpf,
            codigo: codigo
        })
    });

    let data = await resp.json();

    if (!data.ok) {
        if (data.campo) {
            erroCampo(data.campo, data.msg || "");
        }

        msg(data.msg, "erro");

        if (data.msg && data.msg.toLowerCase().includes("expirado")) {
            mostrarModal("Código expirado", "O código expirou após 5 minutos. Solicite um novo código.");
            el("codigoArea").style.display = "none";
            el("senhaArea").style.display = "none";
            el("codigo").value = "";
            el("senha").value = "";
            el("senha2").value = "";
            pararContador();
            el("timerBox").style.display = "none";
        }

        return;
    }

    el("senhaArea").style.display = "block";
    msg("Código validado. Agora crie sua senha numérica de 6 dígitos.", "ok");
}

async function finalizarCadastro() {
    limparErroCampo("senha");
    limparErroCampo("senha2");

    let cpf = el("cpf").value;
    let codigo = el("codigo").value.trim();
    let senha = el("senha").value.trim();
    let senha2 = el("senha2").value.trim();

    let resp = await fetch("/confirmar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            cpf: cpf,
            codigo: codigo,
            senha: senha,
            senha2: senha2
        })
    });

    let data = await resp.json();

    if (!data.ok) {
        if (data.erros) {
            if (data.erros.senha) erroCampo("senha", data.erros.senha);
            if (data.erros.senha2) erroCampo("senha2", data.erros.senha2);
        }

        if (data.campo) {
            erroCampo(data.campo, data.msg || "");
        }

        msg(data.msg, "erro");
        return;
    }

    pararContador();
    el("timerBox").style.display = "none";
    msg("Cadastro realizado com sucesso. Senha OK", "ok");
    mostrarModal("Cadastro concluído", "Cadastro realizado com sucesso. Sua senha já foi definida.");
}

function limpar() {
    el("cpf").value = "";
    el("nome").value = "";
    el("celular").value = "";
    el("email").value = "";
    el("codigo").value = "";
    el("senha").value = "";
    el("senha2").value = "";
    el("codigoArea").style.display = "none";
    el("senhaArea").style.display = "none";
    el("timerBox").style.display = "none";
    pararContador();
    limparErros();
    msg("", "");
    atualizarBotaoEnviar(false);
}

function registrarEventos() {
    el("cpf").addEventListener("input", () => {
        formatarDocumento();
        agendarPrevalidacao();
    });

    el("nome").addEventListener("input", () => {
        normalizarNome();
        agendarPrevalidacao();
    });

    el("celular").addEventListener("input", () => {
        formatarCelular();
        agendarPrevalidacao();
    });

    el("email").addEventListener("input", () => {
        agendarPrevalidacao();
    });

    document.querySelectorAll('input[name="canal"]').forEach(r => {
        r.addEventListener("change", () => {
            agendarPrevalidacao();
        });
    });

    ["cpf", "nome", "celular", "email"].forEach(id => {
        el(id).addEventListener("blur", () => {
            prevalidarSilencioso();
        });
    });
}

registrarEventos();
atualizarBotaoEnviar(false);

// ── Esta tela SEMPRE abre em branco ──────────────────────────────────────
// Nada de pré-preencher: nem pela querystring (/petshop mandava nome/cel/email,
// o login mandava o cpf), nem pelo autofill do navegador. Cadastro de cliente
// novo começa vazio para ninguém gravar sem perceber o dado de outra pessoa.
const CAMPOS_CADASTRO = ["cpf", "nome", "celular", "email", "codigo", "senha", "senha2"];
let pessoaMexeu = false;

function limparCamposIniciais() {
    if (pessoaMexeu) return;
    CAMPOS_CADASTRO.forEach(id => { const c = el(id); if (c) c.value = ""; });
}

// O autofill do Chrome/Edge ignora autocomplete="off" e chega depois do load,
// então limpamos algumas vezes até a pessoa encostar no formulário. Só
// keydown/paste/mousedown contam como "mexeu" — o evento input também é
// disparado pelo próprio autofill e serviria de brecha.
CAMPOS_CADASTRO.forEach(id => {
    const c = el(id);
    if (!c) return;
    ["keydown", "paste", "mousedown"].forEach(ev =>
        c.addEventListener(ev, () => { pessoaMexeu = true; }));
});

// Trava principal contra o "perfil salvo" do navegador (o menu de informações
// pessoais do Edge/Chrome, que chegou a jogar um CPF dentro do campo de
// e-mail): campo readonly não é preenchido por autofill. O readonly sai no
// primeiro foco, então para quem está digitando não muda nada. NÃO devolvemos
// o readonly depois — voltar a travar o campo atrapalharia a edição.
CAMPOS_CADASTRO.forEach(id => {
    const c = el(id);
    if (!c || !c.hasAttribute("readonly")) return;
    const liberar = () => c.removeAttribute("readonly");
    ["focus", "mousedown", "touchstart", "keydown"].forEach(ev =>
        c.addEventListener(ev, liberar, { once: true }));
});

limparCamposIniciais();
window.addEventListener("load", limparCamposIniciais);
[100, 300, 700, 1200].forEach(ms => setTimeout(limparCamposIniciais, ms));
// Sem focar nada no load: foco programático faz o navegador abrir o menu de
// sugestões e é justamente o que não queremos aqui.
</script>

<script src="/static/f10_dialog.js"></script>

</body>
</html>
